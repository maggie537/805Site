<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You | SB Tech Gal</title>
    <meta name="robots" content="noindex">
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --slate-charcoal: #2A2F35;
            --sea-glass: #5A7E7A;
            --montecito-sand: #F9F6F0;
            --muted-gray: #718096;
            --serif-font: 'Cormorant Garamond', Georgia, serif;
            --sans-font: 'Inter', system-ui, -apple-system, sans-serif;
        }
        * { box-sizing: border-box; }
        body {
            background-color: var(--montecito-sand);
            color: var(--slate-charcoal);
            font-family: var(--sans-font);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            margin: 0;
            padding: 24px;
        }
        .container { max-width: 520px; }
        .logo-img { width: 140px; height: auto; margin-bottom: 20px; }
        .logo { font-family: var(--serif-font); font-size: 26px; font-weight: 600; letter-spacing: 1px; margin-bottom: 28px; }
        .logo span { color: var(--sea-glass); font-weight: 400; }
        h1 { font-family: var(--serif-font); font-size: 2.6rem; font-weight: 400; margin: 0 0 14px; }
        p { font-weight: 300; color: var(--muted-gray); line-height: 1.7; margin: 0 0 32px; }
        a.btn { display: inline-block; color: var(--slate-charcoal); border: 1px solid var(--slate-charcoal); padding: 12px 28px; text-decoration: none; font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: 2px; transition: all 0.3s ease; }
        a.btn:hover, a.btn:focus-visible { background: var(--slate-charcoal); color: #fff; }
    </style>
</head>
<body>
    <div class="container">
        <img src="LOGO.png" alt="SB Tech Gal logo" class="logo-img">
        <div class="logo">Santa Barbara <span>Tech Gal</span></div>
        <h1>Thank you!</h1>
        <p>Your request is in. I usually reply within one business day. &mdash; Maggie</p>
        <a href="/" class="btn">Back to home</a>
    </div>
</body>
</html>
