<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You | SB Tech Gal</title>
    <meta name="robots" content="noindex">
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --slate-charcoal: #2A2F35;
            --sea-glass: #5A7E7A;
            --montecito-sand: #F9F6F0;
            --muted-gray: #718096;
            --serif-font: 'Cormorant Garamond', Georgia, serif;
            --sans-font: 'Inter', system-ui, -apple-system, sans-serif;
        }
        * { box-sizing: border-box; }
        body {
            background-color: var(--montecito-sand);
            color: var(--slate-charcoal);
            font-family: var(--sans-font);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            margin: 0;
            padding: 24px;
        }
        .container { max-width: 520px; }
        .logo-img { display: block; width: 120px; height: 120px; margin: 0 auto 16px; }
        .logo { font-family: var(--serif-font); font-size: 30px; font-weight: 600; letter-spacing: 0.5px; color: #0A0D5E; margin-bottom: 28px; }
        .logo span { color: var(--sea-glass); font-weight: 400; }
        h1 { font-family: var(--serif-font); font-size: 2.6rem; font-weight: 400; color: #0A0D5E; margin: 0 0 14px; }
        p { font-weight: 300; color: var(--muted-gray); line-height: 1.7; margin: 0 0 32px; }
        a.btn { display: inline-block; color: #0A0D5E; border: 1px solid #0A0D5E; padding: 12px 28px; text-decoration: none; font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: 2px; transition: all 0.3s ease; }
        a.btn:hover, a.btn:focus-visible { background: #0A0D5E; color: #fff; }
    </style>
</head>
<body>
    <div class="container">
        <img src="img/logo-round-240.webp" alt="" width="120" height="120" class="logo-img">
        <div class="logo">SB Tech Gal</div>
        <h1>Thank you</h1>
        <p>Your request has been sent. We will review it and reach out using the contact method you chose.</p>
        <a href="/" class="btn">Back to home</a>
    </div>
</body>
</html>
